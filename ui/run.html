<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Run · Nemesis Forge</title>
<link rel="stylesheet" href="/app.css"><script src="/app.js"></script></head>
<body>
<div class="wrap">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:2px">
    <h1 class="page" id="title">Run</h1>
    <span id="statePill"></span>
    <span class="sp" style="flex:1"></span>
    <a class="btn" href="/history">← All runs</a>
  </div>
  <div class="sub" id="subtitle"></div>

  <div class="row">
    <div class="card" style="flex:1;min-width:280px">
      <div class="hd">Overview</div><div class="bd"><div class="kv" id="meta"></div></div>
    </div>
    <div class="card" style="flex:1;min-width:280px">
      <div class="hd">Proof ladder</div><div class="bd" id="ladder"></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="hd">Findings <span id="fcount" class="mut" style="text-transform:none;letter-spacing:0;font-weight:400"></span></div>
    <div class="bd" id="findings"><div class="empty">—</div></div>
  </div>

  <div class="row" style="margin-top:16px">
    <div class="card" style="flex:1;min-width:300px">
      <div class="hd">Agent fleet</div><div class="bd tree" id="tree"></div>
    </div>
    <div class="card" style="flex:2;min-width:360px">
      <div class="hd">Checkpoint timeline <span id="evcount" class="mut" style="text-transform:none;letter-spacing:0;font-weight:400"></span></div>
      <div class="feed" id="feed" style="max-height:70vh;overflow:auto"></div>
    </div>
  </div>
</div>
<script>
const JOB = decodeURIComponent(location.pathname.split('/run/')[1]||'');
const AG = {};

function fmtCk(ev){
  const D=ev.data||{}, ag=(AG[ev.agent_id]?.name)||D.name||'';
  const M={
    job_start:['','job',`target <b>${esc(D.target)}</b> (${esc(D.target_type)}) · brain ${esc(D.llm||'deterministic')}`],
    job_done:['up','done',`findings ${D.findings??0} · vendor-ready ${D.vendor_ready??0}`],
    agent_spawned:['','spawn',`<b>${esc(D.name||ag)}</b> joined (${esc(D.kind||'')})`],
    agent_done:[D.failed?'err':'','end',`<b>${esc(D.name||ag)}</b> ${D.failed?'failed':'done'}`],
    objective:['','goal',`<b>${esc(ag)}</b> · ${esc(D.text)}`],
    think:['','think',`<b>${esc(ag)}</b> · ${esc(D.text)}`],
    harness:['','harness',`<b>${esc(ag)}</b> · ${esc(D.source||D.engine||'')} built=${D.built} cov=${D.coverage??''} ${esc(D.reason||'')}`],
    coverage:[D.crashed?'up':'','cov',`${esc(D.engine||'fuzz')}${D.round!=null?' r'+D.round:''} · cov ${D.cov??D.functions??''} ft ${D.features??''} · ${Number(D.execs||0).toLocaleString()} execs${D.focus?' → '+esc(D.focus):''}${D.crashed?' · CRASH':''}`],
    candidate:['','cand',`<code>${esc(D.title)}</code> ${D.why?'· '+esc(D.why):''}`],
    oracle_verdict:[D.outcome==='proven'?'up':(D.outcome==='refuted'?'err':''),'oracle',`${esc(D.oracle||'')} → <b>${esc(D.outcome)}</b>${D.rung!=null?' rung '+D.rung:''}${D.feedback?' · '+esc(D.feedback):''}`],
    rung_up:['up','rung↑',`<code>${esc(D.title)}</code> → ${esc(D.rung_name)}`],
    poc_written:['up','poc',`${esc(D.title||'exploit')} ${D.rationale?'· '+esc(D.rationale):''}`],
    validated:['up','valid',`<code>${esc(D.title)}</code> confirmed`],
    vendor_packet:['up','packet',`<code>${esc(D.title||'')}</code> VENDOR_READY`],
    log:['','log',esc(D.text)],
    error:['err','error',`<b>${esc(D.name||ag)}</b> ${esc(D.error||'')}`],
    ladder:['','',''],
  }[ev.type] || ['', ev.type, esc(JSON.stringify(D).slice(0,160))];
  return {cls:M[0], k:M[1], m:M[2]};
}

function handle(ev, live){
  if(ev.type==='agent_spawned') AG[ev.agent_id]={name:ev.data.name,kind:ev.data.kind,parent:ev.parent_id,last:''};
  if(ev.type==='think'&&AG[ev.agent_id]) AG[ev.agent_id].last=ev.data.text;
  if(ev.type==='ladder'){ renderLadder(ev.data.board); return; }
  const f=fmtCk(ev); if(!f.k) return;
  const feed=document.getElementById('feed');
  const el=document.createElement('div'); el.className='ck '+f.cls;
  el.innerHTML=`<span class="t">${clock(ev.ts)}</span><span class="k">${esc(f.k)}</span><span class="m">${f.m}</span>`;
  feed.appendChild(el); if(live) feed.scrollTop=feed.scrollHeight;
}
function renderTree(){
  const t=document.getElementById('tree'); t.innerHTML='';
  const roots=Object.entries(AG).filter(([id,a])=>!a.parent||!AG[a.parent]);
  const draw=(id,depth)=>{ const a=AG[id]; if(!a) return;
    const el=document.createElement('div'); el.className='tnode';
    el.style.marginLeft=(depth*14)+'px';
    el.innerHTML=`<span class="nm">${esc(a.name)}</span> <span class="mut">${esc(a.kind||'')}</span>${a.last?`<div class="last">${esc(a.last).slice(0,80)}</div>`:''}`;
    t.appendChild(el);
    Object.entries(AG).filter(([cid,c])=>c.parent===id).forEach(([cid])=>draw(cid,depth+1)); };
  roots.forEach(([id])=>draw(id,0));
  if(!Object.keys(AG).length) t.innerHTML='<div class="empty">no agents</div>';
}
function renderLadder(board){
  const box=document.getElementById('ladder');
  if(!board||!board.length){ box.innerHTML='<div class="empty">no candidates yet</div>'; return; }
  box.innerHTML=''; board.forEach(c=>{
    box.insertAdjacentHTML('beforeend',
    `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #1c222c">
      <span class="badge">${c.rung}</span><b style="flex:1">${esc(c.title||'')}</b>
      <span class="mut" style="font:11px var(--mono)">${esc(RUNGS[c.rung]||'')}</span></div>`); });
}

async function load(){
  const d = await (await fetch('/api/job/'+encodeURIComponent(JOB))).json();
  const m = d.meta||{};
  document.getElementById('title').textContent = m.target || JOB;
  document.getElementById('subtitle').innerHTML = `<code>${esc(JOB)}</code>`;
  const st = d.running?'running':(m.status==='done'?'done':(m.status||'idle'));
  document.getElementById('statePill').innerHTML = pill(st==='running'?'running':st, st);
  document.getElementById('meta').innerHTML = Object.entries({
    'Job': JOB, 'Target': m.target, 'Type': m.target_type, 'Brain': m.llm||'deterministic',
    'Status': st, 'Findings': m.findings, 'Vendor-ready': m.vendor_ready, 'Top rung': m.top_rung!=null?(m.top_rung+' · '+(RUNGS[m.top_rung]||'')):'—'
  }).map(([k,v])=>`<div class="k">${k}</div><div class="v">${esc(v==null?'—':v)}</div>`).join('');
  renderLadder(d.board);
  // findings
  const fb=document.getElementById('findings'); fb.innerHTML='';
  document.getElementById('fcount').textContent = `— ${(d.findings||[]).length}`;
  (d.findings||[]).forEach(f=>{ fb.insertAdjacentHTML('beforeend',
    `<div style="padding:8px 0;border-bottom:1px solid #1c222c">
      <span class="badge">RUNG ${f.rung}</span> <b>${esc(f.candidate?.title||'')}</b>
      <span class="pill st-${(f.novelty==='candidate')?'running':'idle'}" style="margin-left:6px">${esc(f.novelty||'')}</span>
      <div class="mut" style="font:11px var(--mono);margin-top:3px">${esc(f.verdict?.oracle||'')} · ${esc(f.primitive?.kind||'')} · ${esc(f.candidate?.location?.path||'')}</div></div>`); });
  if(!(d.findings||[]).length) fb.innerHTML='<div class="empty">No findings (a clean run is a real result — the engine does not invent findings).</div>';
  return d.running;
}
async function loadEvents(){
  const d = await (await fetch('/api/job/'+encodeURIComponent(JOB)+'/events')).json();
  document.getElementById('feed').innerHTML='';
  (d.events||[]).forEach(ev=>handle(ev,false));
  document.getElementById('evcount').textContent = `— ${(d.events||[]).length}`;
  renderTree();
  return d.running;
}
async function main(){
  const running = await load();
  await loadEvents();
  if(running){
    // live-tail the run end to end
    const es=new EventSource('/api/job/'+encodeURIComponent(JOB)+'/stream');
    let seen=document.getElementById('feed').children.length;
    es.onmessage=(m)=>{ const ev=JSON.parse(m.data); handle(ev,true); renderTree();
      if(ev.type==='job_done'||ev.type==='error'){ es.close(); setTimeout(()=>{load();},800); } };
    setInterval(load, 4000);   // refresh meta/ladder/findings while running
  }
}
(async()=>{ if(await mount('activity')){ main(); } })();
</script>
</body></html>
