<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Console · Nemesis Forge</title>
<link rel="stylesheet" href="/app.css"><script src="/app.js"></script></head>
<body>
<div class="wrap">
  <h1 class="page">Console</h1>
  <div class="sub">Point the engine at an asset and pick a brain. Discover → <b style="color:var(--accent2)">prove</b> → weaponize — a deterministic oracle certifies every rung.</div>

  <div class="card" style="margin-bottom:16px">
    <div class="hd">Launch engagement</div>
    <div class="bd">
      <div class="row" style="align-items:flex-end">
        <div><label class="fld">Point at</label><select id="mode" onchange="onMode()" style="min-width:230px"></select></div>
        <div id="wPreset"><label class="fld">Lab asset</label><select id="preset" style="min-width:230px"></select></div>
        <div id="wRef" style="display:none"><label class="fld" id="refLbl">Path</label><input id="ref" style="width:320px" placeholder="/path/to/binary"></div>
        <div><label class="fld">Brain</label><select id="provider" onchange="onProvider()" style="min-width:180px"></select></div>
        <div id="wModel"><label class="fld">Model</label><select id="model" style="min-width:160px"></select></div>
        <div id="wKey" style="display:none"><label class="fld">API key</label><input id="apikey" type="password" style="width:150px" placeholder="if hosted"></div>
      </div>
      <div id="wHarness" style="display:none;margin-top:12px">
        <label class="fld">Custom C harness (reads stdin)</label>
        <textarea id="harness" style="width:100%;height:90px" placeholder="int main(){ char b[64]; read(0,b,...); ... }"></textarea>
      </div>
      <div class="row" style="margin-top:12px;align-items:flex-end">
        <div id="wFuzz" style="display:none"><label class="fld">Fuzz budget / target (s)</label><input id="fuzzTime" type="number" value="90" style="width:120px"></div>
        <div id="wTargets" style="display:none"><label class="fld">Max targets</label><input id="maxTargets" type="number" value="2" style="width:100px"></div>
        <button class="btn primary" onclick="scan()" style="padding:9px 20px">▶ Run engagement</button>
        <span id="status" class="mut" style="font-size:13px"></span>
      </div>
    </div>
  </div>

  <div class="card" id="livecard" style="display:none">
    <div class="hd">Live · <code id="livejob"></code>
      <span class="sp" style="flex:1"></span>
      <a class="btn" id="openfull" target="_blank">Open full run view →</a>
    </div>
    <div class="feed" id="feed" style="max-height:60vh;overflow:auto"></div>
  </div>
</div>
<script>
let PROVIDERS=[], MODES=[], ES=null;
async function boot(){
  const [pr,md,pv] = await Promise.all([
    (await fetch('/api/presets')).json(), (await fetch('/api/modes')).json(),
    (await fetch('/api/providers')).json()]);
  const s=document.getElementById('preset'); pr.presets.forEach(p=>s.add(new Option(p.label,p.id)));
  MODES=md.modes; const ms=document.getElementById('mode');
  MODES.forEach(m=>ms.add(new Option(m.label+(m.status?' ['+m.status+']':''),m.id)));
  PROVIDERS=pv.providers; const ps=document.getElementById('provider');
  ps.add(new Option('deterministic only (no LLM)',''));
  PROVIDERS.forEach(p=>ps.add(new Option(p.label+(p.needs_key&&!p.configured?' (needs key)':''),p.id)));
  ps.value = PROVIDERS.find(p=>p.id==='ollama')?'ollama':'';
  onProvider(); onMode();
}
function onMode(){
  const m=MODES.find(x=>x.id===document.getElementById('mode').value)||{};
  document.getElementById('wPreset').style.display=m.input==='preset'?'':'none';
  document.getElementById('wRef').style.display=(m.input==='path'||m.input==='url'||m.input==='serial')?'':'none';
  document.getElementById('wHarness').style.display=m.input==='code'?'':'none';
  const repo=m.id==='repo';
  document.getElementById('wFuzz').style.display=repo?'':'none';
  document.getElementById('wTargets').style.display=repo?'':'none';
  document.getElementById('refLbl').textContent=m.input==='url'?'Git URL / local dir':m.input==='serial'?'ADB serial':'Path';
  document.getElementById('ref').placeholder=m.input==='url'?'https://github.com/org/repo  or  /path/to/src':'/path/to/binary';
}
function onProvider(){
  const p=PROVIDERS.find(x=>x.id===document.getElementById('provider').value);
  const ms=document.getElementById('model'); ms.innerHTML='';
  (p?.models||[]).forEach(m=>ms.add(new Option(m,m)));
  document.getElementById('wModel').style.display=p?'':'none';
  document.getElementById('wKey').style.display=(p&&p.needs_key)?'':'none';
}
async function scan(){
  const mode=document.getElementById('mode').value;
  const refv=document.getElementById('ref').value||null;
  const body={mode, preset:document.getElementById('preset').value,
    ref: mode==='repo'?null:refv, url: mode==='repo'?refv:null,
    harness:document.getElementById('harness').value||null,
    provider:document.getElementById('provider').value||null,
    model:document.getElementById('model').value||null,
    api_key:document.getElementById('apikey').value||null,
    fuzz_time: Number(document.getElementById('fuzzTime').value)||null,
    max_targets: Number(document.getElementById('maxTargets').value)||null};
  document.getElementById('status').textContent='launching…';
  const r=await fetch('/api/scan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){ document.getElementById('status').textContent='error: '+(await r.text()); return; }
  const {job_id}=await r.json();
  document.getElementById('status').innerHTML=`running <code>${esc(job_id)}</code>`;
  document.getElementById('livecard').style.display='';
  document.getElementById('livejob').textContent=job_id;
  document.getElementById('openfull').href='/run/'+job_id;
  document.getElementById('feed').innerHTML='';
  const AG={};
  if(ES)ES.close(); ES=new EventSource('/api/job/'+job_id+'/stream');
  ES.onmessage=(m)=>{ const ev=JSON.parse(m.data); const D=ev.data||{};
    if(ev.type==='agent_spawned')AG[ev.agent_id]=D.name;
    if(ev.type==='ladder')return;
    const line={job_start:['job',`target ${D.target} · ${D.llm||'deterministic'}`],
      agent_spawned:['spawn',(D.name||'')+' ('+(D.kind||'')+')'],
      think:['think',(AG[ev.agent_id]||'')+' · '+(D.text||'')],
      harness:['harness',(D.source||D.engine||'')+' built='+D.built],
      coverage:['cov',(D.engine||'')+' cov '+(D.cov??D.functions??'')+(D.crashed?' CRASH':'')],
      candidate:['cand',D.title||''], oracle_verdict:['oracle',(D.oracle||'')+' → '+(D.outcome||'')+(D.rung!=null?' rung '+D.rung:'')],
      rung_up:['rung↑',(D.title||'')+' → '+(D.rung_name||'')], poc_written:['poc',D.title||'exploit'],
      vendor_packet:['packet','VENDOR_READY'], log:['log',D.text||''], error:['error',D.error||''],
      job_done:['done',`findings ${D.findings??0}`]}[ev.type];
    if(!line)return;
    const el=document.createElement('div'); el.className='ck '+(ev.type==='error'?'err':(['rung_up','poc_written','vendor_packet','job_done'].includes(ev.type)?'up':''));
    el.innerHTML=`<span class="t">${clock(ev.ts)}</span><span class="k">${esc(line[0])}</span><span class="m">${esc(line[1])}</span>`;
    const f=document.getElementById('feed'); f.appendChild(el); f.scrollTop=f.scrollHeight;
    if(ev.type==='job_done'||ev.type==='error'){ ES.close(); document.getElementById('status').innerHTML+=' — done'; }
  };
}
(async()=>{ if(await mount('console')){ boot(); } })();
</script>
</body></html>
