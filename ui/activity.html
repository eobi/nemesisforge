<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Activity · Nemesis Forge</title>
<link rel="stylesheet" href="/app.css"><script src="/app.js"></script></head>
<body>
<div class="wrap">
  <h1 class="page">Live activity</h1>
  <div class="sub">Everything the engine is running right now — including jobs launched from the CLI. Click any run to watch it end to end.</div>

  <div class="card" style="margin-bottom:16px">
    <div class="hd">Running now <span id="rcount" class="mut" style="text-transform:none;letter-spacing:0;font-weight:400"></span></div>
    <div id="running"></div>
  </div>

  <div class="card">
    <div class="hd">Recent runs</div>
    <table class="data"><thead><tr>
      <th>Job</th><th>Target</th><th>Brain</th><th>Status</th><th>Findings</th><th>Top rung</th>
    </tr></thead><tbody id="recent"></tbody></table>
  </div>
</div>
<script>
async function load(){
  const d = await (await fetch('/api/jobs?limit=100')).json();
  document.getElementById('rcount').textContent = `— ${d.counts.running}`;
  const R=document.getElementById('running'); R.innerHTML='';
  if(!d.running.length) R.innerHTML='<div class="empty">Nothing running. Launch an engagement from the Console.</div>';
  d.running.forEach(j=>{
    const card=document.createElement('div');
    card.style.cssText='padding:13px 15px;border-bottom:1px solid #1c222c;cursor:pointer;display:flex;align-items:center;gap:14px';
    card.onclick=()=>window.open('/run/'+j.job_id,'_blank');
    card.innerHTML=`<span class="pill st-running"><span class="d" style="background:currentColor"></span>running</span>
      <div style="flex:1"><b>${esc(j.target||'')}</b> <span class="mut">${esc(j.target_type||'')}</span>
        <div class="mut" style="font:11px var(--mono)"><code>${esc(j.job_id)}</code> · brain ${esc(j.llm||'deterministic')}</div></div>
      <span class="btn">Watch →</span>`;
    R.appendChild(card);
  });
  const tb=document.getElementById('recent'); tb.innerHTML='';
  (d.jobs||[]).slice(0,25).forEach(j=>{
    const st=j.running?'running':(j.status==='done'?'done':(j.status||'idle'));
    const tr=document.createElement('tr'); tr.className='click';
    tr.onclick=()=>window.open('/run/'+j.job_id,'_blank');
    tr.innerHTML=`<td><code>${esc(j.job_id)}</code></td><td><b>${esc(j.target||'')}</b></td>
      <td class="mut">${esc(j.llm||'deterministic')}</td><td>${pill(st==='running'?'running':st,st)}</td>
      <td class="num">${j.findings!=null?j.findings:'—'}</td>
      <td>${j.top_rung!=null?`<span class="badge">${j.top_rung}</span>`:'—'}</td>`;
    tb.appendChild(tr);
  });
  if(!(d.jobs||[]).length) tb.innerHTML='<tr><td colspan=6 class="empty">No runs yet.</td></tr>';
}
(async()=>{ if(await mount('activity')){ load(); setInterval(load, 3000); } })();
</script>
</body></html>
