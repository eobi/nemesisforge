<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>History · Nemesis Forge</title>
<link rel="stylesheet" href="/app.css"><script src="/app.js"></script></head>
<body>
<div class="wrap">
  <h1 class="page">Run history</h1>
  <div class="sub">Every engagement the engine has run. Click a row to open its full detail — findings, the proof ladder, and the complete checkpoint timeline.</div>
  <div class="card">
    <div class="hd">Runs <span id="count" class="mut" style="text-transform:none;letter-spacing:0;font-weight:400"></span></div>
    <table class="data"><thead><tr>
      <th>Job</th><th>Target</th><th>Type</th><th>Brain</th><th>Status</th>
      <th>Findings</th><th>Top rung</th><th>Vendor-ready</th>
    </tr></thead><tbody id="rows"></tbody></table>
  </div>
</div>
<script>
async function load(){
  const d = await (await fetch('/api/jobs?limit=300')).json();
  document.getElementById('count').textContent =
    `— ${d.counts.total} total, ${d.counts.running} running`;
  const tb=document.getElementById('rows'); tb.innerHTML='';
  (d.jobs||[]).forEach(j=>{
    const st = j.running ? 'running' : (j.status==='done'?'done':(j.status||'idle'));
    const rung = j.top_rung!=null ? `<span class="badge">${j.top_rung}</span> ${RUNGS[j.top_rung]||''}` : '—';
    const tr=document.createElement('tr'); tr.className='click';
    tr.onclick=()=>window.open('/run/'+j.job_id,'_blank');
    tr.innerHTML=`<td><code>${esc(j.job_id||'')}</code></td>
      <td><b>${esc(j.target||'')}</b></td>
      <td class="mut">${esc(j.target_type||'')}</td>
      <td class="mut">${esc(j.llm||'deterministic')}</td>
      <td>${pill(st==='running'?'running':(st==='done'?'done':st))}</td>
      <td class="num">${j.findings!=null?j.findings:'—'}</td>
      <td>${rung}</td>
      <td class="num">${j.vendor_ready||0}</td>`;
    tb.appendChild(tr);
  });
  if(!(d.jobs||[]).length) tb.innerHTML='<tr><td colspan=8 class="empty">No runs yet — launch one from the Console.</td></tr>';
}
(async()=>{ if(await mount('history')){ load(); setInterval(load, 5000); } })();
</script>
</body></html>
